# Pulls the workspace image on every node ahead of time, so a new
# workspace does not wait for the pull.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prepull-speed-base
  namespace: coder-workspaces
spec:
  selector:
    matchLabels: {app: prepull-speed-base}
  template:
    metadata:
      labels: {app: prepull-speed-base}
    spec:
      nodeSelector:
        coder.com/pool: speed
      tolerations:
        - {key: coder.com/pool, operator: Equal, value: speed, effect: NoSchedule}
      initContainers:
        - name: pull
          image: registry.example.com/coder/workspace:speed-v1
          command: ["true"]
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 1m, memory: 8Mi}}
