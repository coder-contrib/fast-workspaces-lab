apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prepull-speed-claim
  namespace: coder-workspaces
spec:
  selector:
    matchLabels:
      app: prepull-speed-claim
  template:
    metadata:
      labels:
        app: prepull-speed-claim
    spec:
      nodeSelector:
        coder.com/pool: speed
      tolerations:
        - key: coder.com/pool
          operator: Equal
          value: speed
          effect: NoSchedule
      initContainers:
        - name: pull
          image: registry.example.com/coder/workspace:no-claude-v1
          imagePullPolicy: IfNotPresent
          command: ["true"]
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
